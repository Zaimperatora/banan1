<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Симулятор Камня</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
    #loginForm { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(44,62,80,0.9); padding: 40px; border-radius: 16px; color: white; z-index: 100; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
    #loginForm input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #555; margin: 15px 10px 0 0; width: 200px; background: rgba(255,255,255,0.1); color: white; }
    #loginForm button { padding: 12px 24px; font-size: 16px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
    #loginForm button:hover { background: #2ecc71; }
    #leaderboardBtn { background: #3498db; } #leaderboardBtn:hover { background: #5dade2; }
    #timer { position: fixed; top: 20px; right: 20px; color: white; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 12px 24px; border-radius: 8px; display: none; z-index: 50; }
    #clock { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 15px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px; display: none; z-index: 50; }
    #idleHint { position: fixed; bottom: 20px; right: 20px; color: rgba(255,255,255,0.7); font-size: 14px; background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 8px; display: none; z-index: 50; }
    #biomeBar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: none; gap: 8px; z-index: 50; }
    #biomeBar button { padding: 8px 16px; font-size: 14px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); color: white; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    #biomeBar button.active { background: #27ae60; border-color: #27ae60; font-weight: bold; }
    #leaderboardModal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; justify-content: center; align-items: center; }
    #leaderboardContent { background: rgba(20,30,48,0.95); color: white; border-radius: 12px; padding: 24px; min-width: 320px; backdrop-filter: blur(10px); }
    #leaderboardContent h3 { margin: 0 0 15px 0; font-size: 20px; color: #f1c40f; }
    #leaderboardContent table { width: 100%; border-collapse: collapse; font-size: 16px; }
    #leaderboardContent td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    #leaderboardContent .me { background: rgba(39,174,96,0.4); border-radius: 6px; }
    #leaderboardContent .rank { color: #95a5a6; width: 30px; }
    #leaderboardContent .time { text-align: right; color: #bdc3c7; }
    #closeLeaderboard { margin-top: 15px; padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; }
    #exitBtn { position: fixed; top: 20px; left: 20px; padding: 12px 24px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; z-index: 50; display: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="loginForm">
    <h2>Симулятор Камня</h2>
    <input type="text" id="username" placeholder="Твоё имя">
    <button id="startBtn">Начать игру</button>
    <button id="leaderboardBtn">Таблица лидеров</button>
  </div>
  <div id="leaderboardModal"><div id="leaderboardContent"><h3>Таблица лидеров (топ-10)</h3><table id="lbTable"></table><button id="closeLeaderboard">Закрыть</button></div></div>
  <div id="timer">Время сессии: <span id="timeValue">0</span> сек</div>
  <div id="clock">☀️ День</div>
  <div id="idleHint">📷 Камера крутится сама — тронь мышь</div>
  <div id="biomeBar">
    <button data-b="forest" class="active">🌲 Лес</button>
    <button data-b="winter">❄️ Зима</button>
    <button data-b="beach">🏖️ Пляж</button>
    <button data-b="desert">🏜️ Пустыня</button>
  </div>
  <button id="exitBtn">🚪 Выйти и сохранить</button>
  <canvas id="cv"></canvas>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== БД =====
    const SUPABASE_URL = 'https://jndlzfteecpcguqxqpwd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_44I121BlKsABcW2sep0gIQ_Lkt3X6_m'.trim();
    let supabase = null;
    function withTimeout(p, ms = 8000) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
    const dbReadyPromise = (async () => {
      try {
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        const { error } = await withTimeout(supabase.from('players').select('id').limit(1));
        if (error) throw error;
        console.log('✅ БД подключена');
      } catch (e) { console.warn('❌ БД недоступна (нужен GitHub Pages / http):', e.message); supabase = null; }
    })();

    let playerId = null, baseTime = 0, sessionTime = 0, timerInterval = null;
    const $ = id => document.getElementById(id);
    const loginForm = $('loginForm'), startBtn = $('startBtn'), leaderboardBtn = $('leaderboardBtn');
    const usernameInput = $('username'), timerDiv = $('timer'), timeValue = $('timeValue'), exitBtn = $('exitBtn');
    const idleHint = $('idleHint'), clock = $('clock'), biomeBar = $('biomeBar');
    const leaderboardModal = $('leaderboardModal'), closeLeaderboard = $('closeLeaderboard'), lbTable = $('lbTable');

    async function refreshLeaderboard() {
      let players = [];
      if (supabase) { try { const { data } = await supabase.from('players').select('id, username, playtime').order('playtime', { ascending: false }).limit(10); if (data) players = data; } catch (e) {} }
      if (!players.length) players = JSON.parse(localStorage.getItem('rockPlayers') || '[]').sort((a, b) => b.playtime - a.playtime).slice(0, 10);
      lbTable.innerHTML = players.map((p, i) => `<tr class="${p.id === playerId ? 'me' : ''}"><td class="rank">${i + 1}</td><td>${p.username}</td><td class="time">${p.playtime} с</td></tr>`).join('') || '<tr><td colspan="3">Пока пусто</td></tr>';
    }
    leaderboardBtn.addEventListener('click', () => { refreshLeaderboard(); leaderboardModal.style.display = 'flex'; });
    closeLeaderboard.addEventListener('click', () => leaderboardModal.style.display = 'none');

    async function savePlaytime() {
      const total = baseTime + sessionTime, name = usernameInput._name;
      if (supabase && name) {
        try {
          const { data: ex } = await withTimeout(supabase.from('players').select('id').eq('username', name).maybeSingle());
          if (ex) await withTimeout(supabase.from('players').update({ playtime: total }).eq('id', ex.id));
          else await withTimeout(supabase.from('players').insert([{ username: name, playtime: total }]));
          console.log('✅ Сохранено в БД:', total); return;
        } catch (e) { console.warn('❌ БД ошибка:', e.message); }
      }
      const players = JSON.parse(localStorage.getItem('rockPlayers') || '[]');
      const p = players.find(x => x.username === name);
      if (p) p.playtime = total; else players.push({ id: Date.now(), username: name, playtime: total });
      localStorage.setItem('rockPlayers', JSON.stringify(players));
    }

    startBtn.addEventListener('click', async () => {
      const username = usernameInput.value.trim(); if (!username) return alert('Введи имя!');
      usernameInput._name = username;
      await dbReadyPromise;
      if (supabase) { try { const { data: existing } = await withTimeout(supabase.from('players').select('id, playtime').eq('username', username).maybeSingle()); baseTime = existing ? (existing.playtime || 0) : 0; } catch (e) { supabase = null; baseTime = 0; } }
      if (!supabase) { const players = JSON.parse(localStorage.getItem('rockPlayers') || '[]'); baseTime = (players.find(x => x.username === username) || {}).playtime || 0; }
      sessionTime = 0;
      loginForm.style.display = 'none'; timerDiv.style.display = 'block'; exitBtn.style.display = 'block';
      clock.style.display = 'block'; biomeBar.style.display = 'flex'; timeValue.textContent = 0;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => { sessionTime++; timeValue.textContent = sessionTime; if (sessionTime % 5 === 0) savePlaytime(); }, 1000);
    });

    exitBtn.addEventListener('click', async () => {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      await savePlaytime();
      baseTime = 0; sessionTime = 0; usernameInput.value = '';
      loginForm.style.display = 'block'; timerDiv.style.display = 'none'; exitBtn.style.display = 'none';
      clock.style.display = 'none'; biomeBar.style.display = 'none';
    });

    // ===== 3D МИР =====
    const cv = $('cv');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(0, 8, 18); // Безопасная позиция внутри лимитов
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: cv });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9; // Сбалансированная яркость
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x87CEEB, 1); // ЗАПАСНОЙ ФОН (решает проблему чёрного экрана)

    const ambient = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambient);
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2); sunLight.castShadow = true;
    sunLight.shadow.camera.left = -50; sunLight.shadow.camera.right = 50; sunLight.shadow.camera.top = 50; sunLight.shadow.camera.bottom = -50;
    sunLight.shadow.mapSize.set(2048, 2048); scene.add(sunLight);
    
    const sunBall = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 16), new THREE.MeshBasicMaterial({ fog: false })); scene.add(sunBall);
    const moonBall = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xdfe6ff, fog: false })); moonBall.visible = false; scene.add(moonBall);
    
    const starGeo = new THREE.BufferGeometry();
    { const arr = []; for (let i = 0; i < 600; i++) { const a = Math.random() * 6.28, e = Math.random() * 1.57, r = 200; arr.push(Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r+20, Math.sin(a)*Math.cos(e)*r); } starGeo.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); }
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, fog: false })); stars.visible = false; scene.add(stars);

    const LAKE = { x: 26, z: -18, r: 11 };
    const BIOMES = {
      forest: { sky: ['#4FC3F7', '#81D4FA', '#B3E5FC'], fog: 0xB3E5FC, fogFar: 130, sun: 0xffffff, sunI: 1.2, amb: 0.6, mtn: [0x6D6D7A, 0x5C6B73, 0x7A6A5A, 0x6B705C], dune: 0.22, ground: { dark: 0x558B2F, light: 0x9CCC65, dirt: 0x8D6E63 }, height: 1, water: 0x2196F3, frozen: false, trees: 'forest', animals: { small: ['rabbit', 8], big: ['dog', 5] }, particles: null },
      winter: { sky: ['#B0C4DE', '#D7E3F4', '#EAF2FF'], fog: 0xEAF2FF, fogFar: 110, sun: 0xE3F0FF, sunI: 1.1, amb: 0.7, mtn: [0x8A97A8, 0x7A8899, 0x9FB4C7], dune: 0.22, ground: { dark: 0xDDE6F0, light: 0xF5FAFF, dirt: 0xC5D2E0 }, height: 0.8, water: 0x9FD4FF, frozen: true, trees: 'winter', animals: { small: ['penguin', 9], big: ['deer', 4] }, particles: 'snow' },
      beach: { sky: ['#29B6F6', '#81D4FA', '#FFF3C4'], fog: 0xCDEFFB, fogFar: 150, sun: 0xFFF3D0, sunI: 1.4, amb: 0.7, mtn: [0xC9A06A, 0xB8925A, 0xD9B87A, 0xA88050], dune: 0.16, ground: { dark: 0xD9B87A, light: 0xF0DCA8, dirt: 0xB8925A }, height: 0.5, water: 0x18A9E0, frozen: false, sea: true, trees: 'beach', animals: { small: ['crab', 10], big: ['seal', 3] }, particles: null },
      desert: { sky: ['#FFB74D', '#FFD180', '#FFE9B0'], fog: 0xFFE0A0, fogFar: 140, sun: 0xFFDFA0, sunI: 1.4, amb: 0.7, mtn: [0xC8954E, 0xB07830, 0xD4A76A, 0xA87030], dune: 0.14, ground: { dark: 0xC8954E, light: 0xE8C888, dirt: 0xA87030 }, height: 1.4, water: 0x26C6DA, frozen: false, trees: 'desert', animals: { small: ['lizard', 8], big: ['camel', 3] }, particles: 'dust' },
    };
    let biome = 'forest';

    function heightAt(x, z) {
      const b = BIOMES[biome], d = Math.hypot(x, z);
      const flat = Math.min(1, Math.max(0, (d - 7) / 12));
      let h = flat * (Math.sin(x * 0.08) * Math.cos(z * 0.07) * 1.3 + Math.sin(x * 0.21 + z * 0.13) * 0.45 + Math.sin(x * 0.05 - z * 0.04) * 1.6) * b.height;
      const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
      if (dl < LAKE.r) h -= (1 - dl / LAKE.r) * 2.2;
      if (b.sea && x > 60) h -= Math.min(4, (x - 60) * 0.15);
      return h;
    }

    let world = new THREE.Group(); scene.add(world);
    let waterMesh = null, particleSystem = null, fireflies = [];
    let trees = [], clouds = [], smallA = [], bigA = [];
    const M = (c) => new THREE.MeshStandardMaterial({ color: c, flatShading: true });
    const MS = (c) => new THREE.MeshStandardMaterial({ color: c });
    const eye = (x,y,z,s=0.04) => { const e=new THREE.Mesh(new THREE.SphereGeometry(s,8,8),M(0x1a1a1a)); e.position.set(x,y,z); return e; };

    // Нога с pivot в бедре, висящая вниз
    function limb(x, hipY, z, len, rad, color) {
      const g = new THREE.Group(); g.position.set(x, hipY, z);
      const m = new THREE.Mesh(new THREE.CapsuleGeometry(rad, len, 4, 8), M(color));
      m.position.y = -(len / 2); m.castShadow = true; g.add(m);
      return g;
    }

    function clearWorld() { while (world.children.length) { const o = world.children.pop(); o.traverse && o.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m.dispose()); }); } world = new THREE.Group(); scene.add(world); trees=[]; clouds=[]; smallA=[]; bigA=[]; fireflies=[]; waterMesh=null; }

    function buildGround() {
      const b = BIOMES[biome];
      const g = new THREE.PlaneGeometry(400, 400, 130, 130); g.rotateX(-Math.PI / 2);
      const p = g.attributes.position, col = new Float32Array(p.count * 3);
      const dark = new THREE.Color(b.ground.dark), light = new THREE.Color(b.ground.light), dirt = new THREE.Color(b.ground.dirt), tmp = new THREE.Color();
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), z = p.getZ(i); p.setY(i, heightAt(x, z));
        const n = 0.5 + 0.5 * Math.sin(x * 0.5) * Math.sin(z * 0.45) * Math.sin((x + z) * 0.13);
        tmp.copy(dark).lerp(light, n);
        const d = Math.hypot(x, z); if (d < 3.5) tmp.lerp(dirt, (3.5 - d) / 3.5 * 0.7);
        const path = Math.abs(z - (LAKE.z * (x / LAKE.x))); if (x > 0 && x < LAKE.x && path < 2) tmp.lerp(dirt, 0.5);
        col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
      }
      g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
      const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 })); m.receiveShadow = true; world.add(m);
    }

    function buildWater() {
      const b = BIOMES[biome];
      const geo = new THREE.CircleGeometry(b.sea ? 200 : LAKE.r - 0.5, 48); geo.rotateX(-Math.PI / 2);
      const mat = new THREE.MeshPhysicalMaterial({ color: b.water, roughness: 0.1, metalness: 0.2, transparent: true, opacity: b.frozen ? 0.95 : 0.75, transmission: b.frozen ? 0 : 0.4 });
      waterMesh = new THREE.Mesh(geo, mat);
      waterMesh.position.set(b.sea ? 130 : LAKE.x, -0.9, b.sea ? 0 : LAKE.z);
      if (b.sea) waterMesh.scale.set(1, 1, 1.4);
      world.add(waterMesh);
      if (!b.sea) { const sc = new THREE.PlaneGeometry(3, 26); sc.rotateX(-Math.PI / 2); const stream = new THREE.Mesh(sc, mat); stream.position.set(LAKE.x - 12, -0.85, LAKE.z + 8); stream.rotation.y = 0.5; world.add(stream); }
    }

    function buildMountains() {
      const cols = BIOMES[biome].mtn;
      const snowy = (biome === 'winter' || biome === 'forest');
      const duneY = BIOMES[biome].dune;
      for (let i = 0; i < 26; i++) {
        const g = new THREE.Group(); const kind = Math.random();
        const baseCol = cols[Math.floor(Math.random() * cols.length)];
        if (kind < 0.45 && snowy) {
          const peaks = 2 + (Math.random() * 3 | 0);
          for (let p = 0; p < peaks; p++) {
            const h = 12 + Math.random() * 18, r = 7 + Math.random() * 8;
            const peak = new THREE.Mesh(new THREE.ConeGeometry(r*1.5, h*0.7, 6), M(new THREE.Color(baseCol).offsetHSL(0,0,(Math.random()-.5)*0.1)));
            peak.position.set((p - peaks/2) * 8, h/2, (Math.random()-.5)*7); peak.rotation.y = Math.random()*3.14; g.add(peak);
            if (h > 18) { const s = new THREE.Mesh(new THREE.ConeGeometry(r*0.32, h*0.28, 6), M(0xF5F5F5)); s.position.set(peak.position.x, h*0.87, peak.position.z); g.add(s); }
          }
        } else {
          const blobs = 3 + (Math.random()*3|0);
          for (let p = 0; p < blobs; p++) {
            const r = 14 + Math.random()*16;
            const b = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 8, 0, 6.28, 0, 1.57), M(new THREE.Color(baseCol).offsetHSL(0,0,(Math.random()-.5)*0.08)));
            b.scale.set(1, duneY + Math.random()*0.1, 1.15); b.position.set((p-blobs/2)*11, 0, (Math.random()-.5)*8); b.receiveShadow = true; g.add(b);
          }
        }
        const ang = (i/26)*6.28 + (Math.random()-.5)*0.3, dist = 80 + Math.random()*45;
        const mx = Math.cos(ang)*dist, mz = Math.sin(ang)*dist;
        g.position.set(mx, heightAt(mx, mz)-1, mz); g.rotation.y = Math.random()*3.14;
        world.add(g);
      }
      const cave = new THREE.Group();
      const dome = new THREE.Mesh(new THREE.SphereGeometry(5, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2), M(biome === 'winter' ? 0x9FB4C7 : 0x5A5A66));
      dome.scale.set(1.5, 0.5, 1); dome.position.y = -2.2; dome.castShadow = true; cave.add(dome);
      const hole = new THREE.Mesh(new THREE.CircleGeometry(2, 14), new THREE.MeshBasicMaterial({ color: 0x05060a }));
      hole.position.set(0, 0.6, 4.6); cave.add(hole);
      const cx = -55, cz = 30; cave.position.set(cx, heightAt(cx, cz) + 0.3, cz); cave.rotation.y = 0.6;
      world.add(cave);
    }

    function buildFlora() {
      const b = BIOMES[biome];
      if (biome !== 'beach' && biome !== 'desert') {
        const bg = new THREE.ConeGeometry(0.05, 0.5, 4); bg.translate(0, 0.25, 0);
        const bm = new THREE.MeshStandardMaterial({ color: biome === 'winter' ? 0xE8F0F8 : 0x66BB6A, flatShading: true });
        const gr = new THREE.InstancedMesh(bg, bm, 1500); const dm = new THREE.Object3D();
        for (let i = 0; i < 1500; i++) { const a = Math.random() * 6.28, d = 1.5 + Math.random() * 32; const x = Math.cos(a) * d, z = Math.sin(a) * d; dm.position.set(x, heightAt(x, z), z); dm.rotation.set((Math.random() - .5) * .5, Math.random() * 3.14, (Math.random() - .5) * .5); dm.scale.setScalar(.5 + Math.random()); dm.updateMatrix(); gr.setMatrixAt(i, dm.matrix); }
        world.add(gr);
      }
      const treeFn = { forest: () => Math.random() < .55 ? pine() : broadleaf(), winter: () => snowPine(), beach: () => palm(), desert: () => cactus() }[b.trees];
      const count = biome === 'beach' ? 16 : biome === 'desert' ? 22 : 45;
      for (let i = 0; i < count; i++) { const t = treeFn(); const a = Math.random() * 6.28, d = 12 + Math.random() * 38; const x = Math.cos(a) * d, z = Math.sin(a) * d; if (Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + 2) continue; t.position.set(x, heightAt(x, z), z); t.scale.setScalar(0.8 + Math.random() * 0.5); t.userData.phase = Math.random() * 6.28; world.add(t); trees.push(t); }

      for (let i = 0; i < 35; i++) { const bu = new THREE.Group(); const sp = 4 + (Math.random() * 4 | 0); for (let s = 0; s < sp; s++) { const sh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45 + Math.random() * 0.35, 0), M(new THREE.Color().setHSL(biome === 'desert' ? 0.1 : 0.25, 0.7, biome === 'winter' ? 0.7 : 0.3))); sh.position.set((Math.random() - .5) * 1.1, Math.random() * 0.35, (Math.random() - .5) * 1.1); sh.castShadow = true; bu.add(sh); } const a = Math.random() * 6.28, d = 6 + Math.random() * 32; const x = Math.cos(a) * d, z = Math.sin(a) * d; if (Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + 1) continue; bu.position.set(x, heightAt(x, z), z); world.add(bu); }

      const tail=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.4,5),M(c)); tail.position.set(-0.82,0.35,0); tail.rotation.z=1.57; s.add(tail);
      s.userData={legs}; return s; }

    function buildRock() { const rg = new THREE.Group(); const geo = new THREE.SphereGeometry(0.8, 24, 16); const pos = geo.attributes.position; const v = new THREE.Vector3(); for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); const n = Math.sin(v.x * 3.1 + v.y * 2.7) * Math.sin(v.y * 3.7 + v.z * 4.1) * Math.sin(v.z * 2.9 + v.x * 3.3); v.multiplyScalar(1 + n * 0.15); pos.setXYZ(i, v.x, v.y, v.z); } geo.computeVertexNormals(); const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x9E9E9E, roughness: 0.8, flatShading: true })); rock.scale.set(1, .8, .9); rock.castShadow = true; rg.add(rock); rg.position.y = 0.35; world.add(rg); for (let i = 0; i < 25; i++) { const s = 0.2 + Math.random() * 0.35; const pe = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), M(new THREE.Color().setHSL(0, 0, 0.35 + Math.random() * 0.2))); const a = Math.random() * 6.28, d = 3 + Math.random() * 20; pe.position.set(Math.cos(a) * d, heightAt(Math.cos(a) * d, Math.sin(a) * d) + s / 2, Math.sin(a) * d); pe.castShadow = true; world.add(pe); } }

    function applySkyFog() {
      const b = BIOMES[biome];
      try {
        const sc = document.createElement('canvas');
        sc.width = 4; sc.height = 512;
        const c = sc.getContext('2d');
        const g = c.createLinearGradient(0, 0, 0, 512);
        g.addColorStop(0, b.sky[0]); g.addColorStop(0.5, b.sky[1]); g.addColorStop(1, b.sky[2]);
        c.fillStyle = g; c.fillRect(0, 0, 4, 512);
        if (scene.background) scene.background.dispose();
        scene.background = new THREE.CanvasTexture(sc);
      } catch (e) {
        scene.background = new THREE.Color(b.fog); // Fallback на случай сбоя
      }
      if (scene.fog) scene.fog.color.setHex(b.fog);
      else scene.fog = new THREE.Fog(b.fog, 40, b.fogFar);
      scene.fog.far = b.fogFar;
      sunLight.color.setHex(b.sun);
      sunLight.intensity = b.sunI;
      ambient.intensity = b.amb;
    }

    function buildWorld() { clearWorld(); applySkyFog(); buildGround(); buildWater(); buildMountains(); buildFlora(); buildRock(); }

    biomeBar.addEventListener('click', e => { const b = e.target.dataset.b; if (!b) return; biome = b; document.querySelectorAll('#biomeBar button').forEach(x => x.classList.toggle('active', x.dataset.b === b)); buildWorld(); });

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.5, 0);
    controls.minDistance = 3;
    controls.maxDistance = 30;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.enablePan = false;
    controls.autoRotateSpeed = 1.2;
    controls.update(); // Применяем лимиты до первого рендера
    
    let lastInteract = performance.now(); const markActive = () => lastInteract = performance.now(); ['pointerdown', 'wheel', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, markActive));

    function smoothRot(u, target, dt) { let diff = target - u.rot; while (diff > Math.PI) diff -= 6.283; while (diff < -Math.PI) diff += 6.283; u.rot += diff * Math.min(1, dt * 6); return u.rot; }
    function wander(obj, u, dt) {
      if (u.rest > 0) { u.rest -= dt; return false; }
      const dx = u.tx - obj.position.x, dz = u.tz - obj.position.z, dist = Math.hypot(dx, dz);
      if (dist < 0.5) { const a = Math.random() * 6.28, d = u.minD + Math.random() * (u.maxD - u.minD); u.tx = Math.cos(a) * d; u.tz = Math.sin(a) * d; if (Math.random() < 0.4) u.rest = 1 + Math.random() * 3; return false; }
      const vx = dx / dist * u.speed * dt, vz = dz / dist * u.speed * dt;
      obj.position.x += vx; obj.position.z += vz;
      obj.rotation.y = smoothRot(u, Math.atan2(vx, vz), dt);
      return true;
    }

    buildWorld();

    let t = 0; const dayLen = 90;
    const legPhase = [0, Math.PI, Math.PI, 0];
    (function animate() {
      requestAnimationFrame(animate);
      const dt = 0.016; t += dt;
      const dayT = (t % dayLen) / dayLen;
      const sunAng = dayT * 6.283 + 1.57;
      const sunY = Math.sin(sunAng); const isNight = sunY < -0.05;
      sunLight.position.set(Math.cos(sunAng) * 30, Math.max(2, sunY * 30), 15);
      sunBall.position.set(Math.cos(sunAng) * 120, sunY * 120, -60);
      sunBall.visible = !isNight; moonBall.visible = isNight; stars.visible = isNight;
      moonBall.position.set(-Math.cos(sunAng) * 120, -sunY * 120, -60);
      const nightFactor = Math.max(0, Math.min(1, (-sunY - 0.05) * 2));
      ambient.intensity = BIOMES[biome].amb * (1 - nightFactor * 0.4);
      sunLight.intensity = BIOMES[biome].sunI * (1 - nightFactor * 0.6);
      clock.textContent = isNight ? '🌙 Ночь' : (sunY < 0.3 ? '🌅 Закат/рассвет' : '☀️ День');
      fireflies.forEach(f => { const on = isNight; f.visible = on; if (on) { f.position.y = f.userData.base.y + Math.sin(t * 2 + f.userData.ph) * 0.5; f.material.opacity = 0.5 + 0.5 * Math.sin(t * 4 + f.userData.ph); } });

      const idle = performance.now() - lastInteract > 3000;
      controls.autoRotate = idle;
      idleHint.style.display = (idle && loginForm.style.display === 'none') ? 'block' : 'none';

      clouds.forEach(c => { c.position.x += c.userData.speed; if (c.position.x > 100) c.position.x = -100; });
      trees.forEach(tr => { tr.rotation.z = Math.sin(t * 1.2 + tr.userData.phase) * 0.02; });
      if (waterMesh) { const wp = waterMesh.geometry.attributes.position; for (let i = 0; i < wp.count; i++) { const x = wp.getX(i), z = wp.getZ(i); wp.setY(i, Math.sin(x * 0.3 + t * 2) * 0.12 + Math.cos(z * 0.2 + t * 1.5) * 0.1); } wp.needsUpdate = true; }
      if (particleSystem) { const pp = particleSystem.geometry.attributes.position; const sp = BIOMES[biome].particles === 'snow' ? -2 : -0.5; for (let i = 0; i < pp.count; i++) { let y = pp.getY(i) + sp * dt; if (y < 0) y = 60; pp.setY(i, y); if (BIOMES[biome].particles === 'dust') pp.setX(i, pp.getX(i) + 2 * dt); } pp.needsUpdate = true; }

      const bflies = world.children.filter(c => c.userData && c.userData.wl);
      bflies.forEach(b => { const u = b.userData; u.angle += 0.02 * u.speed; b.position.x = Math.cos(u.angle) * u.radius; b.position.z = Math.sin(u.angle) * u.radius; b.position.y = u.height + Math.sin(t * 3 + u.phase) * 0.5; b.rotation.y = smoothRot(u, Math.atan2(-Math.sin(u.angle), Math.cos(u.angle)), dt); const flap = 0.5 + Math.abs(Math.sin(t * 10 + u.phase)) * 0.9; u.wl.rotation.y = -flap; u.wr.rotation.y = flap; });

      smallA.forEach(r => {
        const u = r.userData; const moving = wander(r, u, dt);
        const gY = heightAt(r.position.x, r.position.z);
        const freq = u.speed * 6;
        const bob = moving ? Math.abs(Math.sin(t * freq + u.phase)) * 0.18 : 0;
        r.position.y = gY + bob;
        const swing = moving ? Math.sin(t * freq + u.phase) : 0;
        u.legs.forEach((l, i) => { l.rotation.x = swing * Math.cos(legPhase[i % 4]) * 0.6; });
      });
      bigA.forEach(d => {
        const u = d.userData; const moving = wander(d, u, dt);
        const gY = heightAt(d.position.x, d.position.z);
        const freq = u.speed * 5;
        const bob = moving ? Math.abs(Math.sin(t * freq + u.phase)) * 0.12 : 0;
        d.position.y = gY + bob;
        const swing = moving ? Math.sin(t * freq + u.phase) : 0;
        u.legs.forEach((l, i) => { l.rotation.x = swing * Math.cos(legPhase[i % 4]) * 0.55; });
        if (u.tail) u.tail.rotation.y = Math.sin(t * 8 + u.phase) * (moving ? 0.5 : 0.2);
        if (u.head) u.head.rotation.x = Math.sin(t * freq + u.phase + 1) * (moving ? 0.08 : 0.03);
      });

      controls.update();
      renderer.render(scene, camera);
    })();

    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
