<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Симулятор Камня</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    
    #loginForm {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(44, 62, 80, 0.9); padding: 40px; border-radius: 16px;
      color: white; z-index: 100; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }
    #loginForm input {
      padding: 12px; font-size: 16px; border-radius: 8px;
      border: 1px solid #555; margin: 15px 10px 0 0; width: 200px;
    }
    #loginForm button {
      padding: 12px 24px; font-size: 16px; background: #27ae60;
      color: white; border: none; border-radius: 8px; cursor: pointer;
      margin: 5px;
    }
    #loginForm button:hover { background: #2ecc71; }
    #leaderboardBtn { background: #3498db; }
    #leaderboardBtn:hover { background: #5dade2; }
    
    #timer {
      position: fixed; top: 20px; right: 20px; color: white; font-size: 20px;
      font-weight: bold; background: rgba(0,0,0,0.6); padding: 12px 24px;
      border-radius: 8px; display: none; z-index: 50;
    }
    
    #idleHint {
      position: fixed; bottom: 20px; right: 20px; color: rgba(255,255,255,0.7);
      font-size: 14px; background: rgba(0,0,0,0.4); padding: 8px 16px;
      border-radius: 8px; display: none; z-index: 50;
    }
    
    #leaderboardModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 200; display: none;
      justify-content: center; align-items: center;
    }
    #leaderboardContent {
      background: rgba(20,30,48,0.95); color: white; border-radius: 12px;
      padding: 24px; min-width: 320px; backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #leaderboardContent h3 { margin: 0 0 15px 0; font-size: 20px; color: #f1c40f; }
    #leaderboardContent table { width: 100%; border-collapse: collapse; font-size: 16px; }
    #leaderboardContent td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    #leaderboardContent .me { background: rgba(39,174,96,0.4); border-radius: 6px; }
    #leaderboardContent .rank { color: #95a5a6; width: 30px; }
    #leaderboardContent .time { text-align: right; color: #bdc3c7; }
    #closeLeaderboard {
      margin-top: 15px; padding: 10px 20px; background: #e74c3c;
      color: white; border: none; border-radius: 6px; cursor: pointer;
    }
    #closeLeaderboard:hover { background: #c0392b; }
    
    canvas { display: block; }
  </style>
</head>
<body>

  <div id="loginForm">
    <h2>Симулятор Камня</h2>
    <input type="text" id="username" placeholder="Твоё имя">
    <button id="startBtn">Начать игру</button>
    <button id="leaderboardBtn">Таблица лидеров</button>
  </div>

  <div id="leaderboardModal">
    <div id="leaderboardContent">
      <h3>Таблица лидеров (топ-10)</h3>
      <table id="lbTable"></table>
      <button id="closeLeaderboard">Закрыть</button>
    </div>
  </div>

  <div id="timer">Время с камнем: <span id="timeValue">0</span> сек</div>
  <div id="idleHint">📷 Камера крутится сама — тронь мышь, чтобы остановить</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== База данных =====
    let supabase = null;
    (async () => {
      try {
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        supabase = createClient(
          'https://jndlzfteecpcguqxqpwd.supabase.co',
          'sb_publishable_44I121BlKsABcW2sep0gIQ_Lkt3X6_m'.trim()
        );
        const checkPromise = supabase.from('players').select('id').limit(1);
        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 500));
        const { error } = await Promise.race([checkPromise, timeoutPromise]);
        if (error) throw error;
      } catch (e) {
        supabase = null;
      }
    })();

    let playerId = null, playtime = 0;
    const loginForm = document.getElementById('loginForm');
    const startBtn = document.getElementById('startBtn');
    const leaderboardBtn = document.getElementById('leaderboardBtn');
    const usernameInput = document.getElementById('username');
    const timerDiv = document.getElementById('timer');
    const timeValue = document.getElementById('timeValue');
    const idleHint = document.getElementById('idleHint');
    const leaderboardModal = document.getElementById('leaderboardModal');
    const closeLeaderboard = document.getElementById('closeLeaderboard');
    const lbTable = document.getElementById('lbTable');

    // ===== Таблица лидеров =====
    async function refreshLeaderboard() {
      let players = [];
      if (supabase) {
        const { data } = await supabase.from('players')
          .select('id, username, playtime')
          .order('playtime', { ascending: false })
          .limit(10);
        if (data) players = data;
      }
      if (!players.length) {
        players = JSON.parse(localStorage.getItem('rockPlayers') || '[]')
          .sort((a, b) => b.playtime - a.playtime).slice(0, 10);
      }
      lbTable.innerHTML = players.map((p, i) =>
        `<tr class="${p.id === playerId ? 'me' : ''}">
           <td class="rank">${i + 1}</td><td>${p.username}</td>
           <td class="time">${p.playtime} с</td></tr>`
      ).join('') || '<tr><td colspan="3">Пока пусто</td></tr>';
    }

    leaderboardBtn.addEventListener('click', () => {
      refreshLeaderboard();
      leaderboardModal.style.display = 'flex';
    });
    closeLeaderboard.addEventListener('click', () => {
      leaderboardModal.style.display = 'none';
    });
    leaderboardModal.addEventListener('click', (e) => {
      if (e.target === leaderboardModal) leaderboardModal.style.display = 'none';
    });

    // ===== Сохранение времени =====
    async function savePlaytime() {
      if (supabase) {
        await supabase.from('players').update({ playtime }).eq('id', playerId);
      } else {
        const players = JSON.parse(localStorage.getItem('rockPlayers') || '[]');
        const p = players.find(x => x.id === playerId);
        if (p) p.playtime = playtime;
        localStorage.setItem('rockPlayers', JSON.stringify(players));
      }
    }

    // ===== Кнопка «Начать игру» =====
    startBtn.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      if (!username) return alert('Введи имя!');

      if (supabase) {
        try {
          const checkPromise = supabase.from('players')
            .select('id, playtime')
            .eq('username', username)
            .maybeSingle();
          const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 500));
          const { data: existing } = await Promise.race([checkPromise, timeoutPromise]);
          if (existing) {
            playerId = existing.id;
            playtime = existing.playtime || 0;
          } else {
            const { data } = await supabase.from('players')
              .insert([{ username, playtime: 0 }])
              .select();
            if (data) playerId = data[0].id;
          }
        } catch (e) {
          supabase = null;
        }
      }

      if (!playerId) {
        const players = JSON.parse(localStorage.getItem('rockPlayers') || '[]');
        const existing = players.find(p => p.username === username);
        if (existing) {
          playerId = existing.id;
          playtime = existing.playtime || 0;
        } else {
          playerId = Date.now();
          players.push({ id: playerId, username, playtime: 0 });
          localStorage.setItem('rockPlayers', JSON.stringify(players));
        }
      }

      loginForm.style.display = 'none';
      timerDiv.style.display = 'block';
      timeValue.textContent = playtime;

      setInterval(() => {
        playtime++;
        timeValue.textContent = playtime;
        if (playtime % 5 === 0) savePlaytime();
      }, 1000);
    });

    // ===== 3D-мир =====
    const scene = new THREE.Scene();

    const skyCanvas = document.createElement('canvas');
    skyCanvas.width = 2; skyCanvas.height = 512;
    const ctx = skyCanvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#4FC3F7');
    grad.addColorStop(0.5, '#81D4FA');
    grad.addColorStop(1, '#B3E5FC');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 2, 512);
    scene.background = new THREE.CanvasTexture(skyCanvas);
    scene.fog = new THREE.Fog(0xB3E5FC, 40, 120);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
    camera.position.set(0, 3, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(20, 30, 15);
    sunLight.castShadow = true;
    sunLight.shadow.camera.left = -35; sunLight.shadow.camera.right = 35;
    sunLight.shadow.camera.top = 35; sunLight.shadow.camera.bottom = -35;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    const sunBall = new THREE.Mesh(
      new THREE.SphereGeometry(5, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xFFEB3B, fog: false })
    );
    sunBall.position.set(40, 35, -100);
    scene.add(sunBall);

    // ===== РЕЛЬЕФНЫЙ ПОЛУСТАНОВКА: плавные холмы + цветные пятна =====
    function heightAt(x, z) {
      const d = Math.hypot(x, z);
      const flat = Math.min(1, Math.max(0, (d - 7) / 12)); // поляна у камня ровная
      return flat * (
        Math.sin(x * 0.08) * Math.cos(z * 0.07) * 1.3 +
        Math.sin(x * 0.21 + z * 0.13) * 0.45 +
        Math.sin(x * 0.05 - z * 0.04) * 1.6
      );
    }

    const groundGeo = new THREE.PlaneGeometry(400, 400, 120, 120);
    groundGeo.rotateX(-Math.PI / 2);
    {
      const gPos = groundGeo.attributes.position;
      const colAttr = new Float32Array(gPos.count * 3);
      const dark = new THREE.Color(0x558B2F);
      const light = new THREE.Color(0x9CCC65);
      const dirt = new THREE.Color(0x8D6E63);
      const tmp = new THREE.Color();
      for (let i = 0; i < gPos.count; i++) {
        const x = gPos.getX(i), z = gPos.getZ(i);
        gPos.setY(i, heightAt(x, z));
        // пестрый травяной окрас
        const n = 0.5 + 0.5 * Math.sin(x * 0.5) * Math.sin(z * 0.45) * Math.sin((x + z) * 0.13);
        tmp.copy(dark).lerp(light, n);
        // земляная тропка вокруг камня и пятна
        const d = Math.hypot(x, z);
        if (d < 3.5) tmp.lerp(dirt, (3.5 - d) / 3.5 * 0.7);
        const patch = Math.sin(x * 0.11 + 2) * Math.sin(z * 0.09 - 1);
        if (patch > 0.75) tmp.lerp(dirt, 0.25);
        colAttr[i * 3] = tmp.r; colAttr[i * 3 + 1] = tmp.g; colAttr[i * 3 + 2] = tmp.b;
      }
      groundGeo.setAttribute('color', new THREE.BufferAttribute(colAttr, 3));
      groundGeo.computeVertexNormals();
    }
    const ground = new THREE.Mesh(
      groundGeo,
      new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 })
    );
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== ТРАВА (InstancedMesh — тысячи травинок без тормозов) =====
    {
      const bladeGeo = new THREE.ConeGeometry(0.05, 0.5, 4);
      bladeGeo.translate(0, 0.25, 0);
      const bladeMat = new THREE.MeshStandardMaterial({ color: 0x66BB6A, flatShading: true });
      const COUNT = 1500;
      const grass = new THREE.InstancedMesh(bladeGeo, bladeMat, COUNT);
      const dummy = new THREE.Object3D();
      for (let i = 0; i < COUNT; i++) {
        const a = Math.random() * Math.PI * 2, d = 1.5 + Math.random() * 32;
        const x = Math.cos(a) * d, z = Math.sin(a) * d;
        dummy.position.set(x, heightAt(x, z), z);
        dummy.rotation.set((Math.random() - 0.5) * 0.5, Math.random() * Math.PI, (Math.random() - 0.5) * 0.5);
        dummy.scale.setScalar(0.5 + Math.random() * 1.0);
        dummy.updateMatrix();
        grass.setMatrixAt(i, dummy.matrix);
      }
      scene.add(grass);
    }

    // ===== ГОРЫ: несколько вершин + снежные шапки =====
    for (let i = 0; i < 25; i++) {
      const mountain = new THREE.Group();
      const peaks = 3 + Math.floor(Math.random() * 3);
      for (let p = 0; p < peaks; p++) {
        const h = 8 + Math.random() * 16;
        const r = 8 + Math.random() * 10;
        const peak = new THREE.Mesh(
          new THREE.ConeGeometry(r, h, 7),
          new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.25 + Math.random() * 0.1, 0.5, 0.32 + Math.random() * 0.15),
            flatShading: true
          })
        );
        peak.position.set((p - peaks / 2) * 6, h / 2, (Math.random() - 0.5) * 6);
        peak.rotation.y = Math.random() * Math.PI;
        mountain.add(peak);
        if (h > 14) { // снежная шапка
          const snow = new THREE.Mesh(
            new THREE.ConeGeometry(r * 0.32, h * 0.3, 7),
            new THREE.MeshStandardMaterial({ color: 0xF5F5F5, flatShading: true })
          );
          snow.position.set(peak.position.x, h * 0.87, peak.position.z);
          snow.rotation.y = peak.rotation.y;
          mountain.add(snow);
        }
      }
      const ang = (i / 25) * Math.PI * 2;
      const dist = 70 + Math.random() * 30;
      const mx = Math.cos(ang) * dist, mz = Math.sin(ang) * dist;
      mountain.position.set(mx, heightAt(mx, mz), mz);
      scene.add(mountain);
    }

    // ===== ДЕРЕВЬЯ: два вида (сосна и лиственное), покачиваются на ветру =====
    const trees = [];
    function makePine() {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.22, 0.4, 3, 7),
        new THREE.MeshStandardMaterial({ color: 0x5D4037, flatShading: true })
      );
      trunk.position.y = 1.5; trunk.castShadow = true;
      tree.add(trunk);
      const colors = [0x1B5E20, 0x2E7D32, 0x388E3C, 0x43A047, 0x4CAF50];
      for (let j = 0; j < 5; j++) {
        const leaves = new THREE.Mesh(
          new THREE.ConeGeometry(2.6 - j * 0.42, 1.9, 7),
          new THREE.MeshStandardMaterial({ color: colors[j], flatShading: true })
        );
        leaves.position.y = 2.6 + j * 1.35;
        leaves.rotation.y = Math.random() * Math.PI;
        leaves.castShadow = true;
        tree.add(leaves);
      }
      return tree;
    }
    function makeBroadleaf() {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.45, 3.2, 7),
        new THREE.MeshStandardMaterial({ color: 0x6D4C41, flatShading: true })
      );
      trunk.position.y = 1.6; trunk.castShadow = true;
      tree.add(trunk);
      // ветки
      for (let b = 0; b < 3; b++) {
        const branch = new THREE.Mesh(
          new THREE.CylinderGeometry(0.07, 0.13, 1.3, 5),
          new THREE.MeshStandardMaterial({ color: 0x6D4C41, flatShading: true })
        );
        const ang = (b / 3) * Math.PI * 2 + Math.random();
        branch.position.set(Math.cos(ang) * 0.5, 2.6, Math.sin(ang) * 0.5);
        branch.rotation.z = Math.cos(ang) * 0.7;
        branch.rotation.x = Math.sin(ang) * 0.7;
        tree.add(branch);
      }
      // пышная крона из нескольких шаров
      const greens = [0x388E3C, 0x43A047, 0x4CAF50, 0x66BB6A];
      for (let j = 0; j < 5; j++) {
        const blob = new THREE.Mesh(
          new THREE.IcosahedronGeometry(1.1 + Math.random() * 0.5, 0),
          new THREE.MeshStandardMaterial({ color: greens[j % 4], flatShading: true })
        );
        blob.position.set((Math.random() - 0.5) * 1.6, 3.6 + Math.random() * 1.2, (Math.random() - 0.5) * 1.6);
        blob.castShadow = true;
        tree.add(blob);
      }
      return tree;
    }
    for (let i = 0; i < 45; i++) {
      const tree = (Math.random() < 0.55) ? makePine() : makeBroadleaf();
      const a = Math.random() * Math.PI * 2;
      const d = 9 + Math.random() * 40;
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      tree.position.set(x, heightAt(x, z), z);
      tree.scale.setScalar(0.8 + Math.random() * 0.6);
      tree.userData.phase = Math.random() * Math.PI * 2;
      scene.add(tree);
      trees.push(tree);
    }

    // ===== КУСТЫ: много сфер + ягоды =====
    for (let i = 0; i < 35; i++) {
      const bush = new THREE.Group();
      const spheres = 4 + Math.floor(Math.random() * 4);
      for (let s = 0; s < spheres; s++) {
        const sphere = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.45 + Math.random() * 0.35, 0),
          new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.25 + Math.random() * 0.06, 0.7, 0.28 + Math.random() * 0.16),
            flatShading: true
          })
        );
        sphere.position.set((Math.random() - 0.5) * 1.1, Math.random() * 0.35, (Math.random() - 0.5) * 1.1);
        sphere.castShadow = true;
        bush.add(sphere);
      }
      // ягоды
      if (Math.random() < 0.5) {
        for (let b = 0; b < 6; b++) {
          const berry = new THREE.Mesh(
            new THREE.SphereGeometry(0.07, 5, 5),
            new THREE.MeshStandardMaterial({ color: Math.random() < 0.5 ? 0xE53935 : 0x3949AB })
          );
          berry.position.set((Math.random() - 0.5) * 1.1, 0.35 + Math.random() * 0.3, (Math.random() - 0.5) * 1.1);
          bush.add(berry);
        }
      }
      const a = Math.random() * Math.PI * 2;
      const d = 5 + Math.random() * 32;
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      bush.position.set(x, heightAt(x, z), z);
      scene.add(bush);
    }

    // ===== ЦВЕТЫ: стебель + лепестки-диски =====
    for (let i = 0; i < 160; i++) {
      const flower = new THREE.Group();
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.025, 0.035, 0.35, 4),
        new THREE.MeshStandardMaterial({ color: 0x558B2F })
      );
      stem.position.y = 0.175;
      flower.add(stem);
      const hue = Math.random();
      const petalMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(hue, 0.85, 0.62),
        side: THREE.DoubleSide, flatShading: true
      });
      for (let p = 0; p < 6; p++) {
        const petal = new THREE.Mesh(new THREE.CircleGeometry(0.08, 6), petalMat);
        const pa = (p / 6) * Math.PI * 2;
        petal.position.set(Math.cos(pa) * 0.07, 0.36, Math.sin(pa) * 0.07);
        petal.rotation.x = -Math.PI / 3;
        petal.rotation.y = -pa;
        flower.add(petal);
      }
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.05, 6, 6),
        new THREE.MeshStandardMaterial({ color: 0xFDD835 })
      );
      core.position.y = 0.37;
      flower.add(core);
      const a = Math.random() * Math.PI * 2;
      const d = 3 + Math.random() * 28;
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      flower.position.set(x, heightAt(x, z), z);
      scene.add(flower);
    }

    // ===== ГРИБЫ =====
    for (let i = 0; i < 25; i++) {
      const mushroom = new THREE.Group();
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1, 0.15, 0.5, 6),
        new THREE.MeshStandardMaterial({ color: 0xFFF9C4, flatShading: true })
      );
      stem.position.y = 0.25;
      mushroom.add(stem);
      const cap = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: Math.random() < 0.6 ? 0xE53935 : 0x8D6E63, flatShading: true })
      );
      cap.position.y = 0.48;
      mushroom.add(cap);
      for (let d = 0; d < 6; d++) {
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(0.05, 4, 4),
          new THREE.MeshStandardMaterial({ color: 0xFFFFFF })
        );
        const angle = Math.random() * Math.PI * 2;
        const radius = 0.15 + Math.random() * 0.15;
        dot.position.set(Math.cos(angle) * radius, 0.5 + Math.random() * 0.1, Math.sin(angle) * radius);
        mushroom.add(dot);
      }
      const a = Math.random() * Math.PI * 2;
      const d = 4 + Math.random() * 24;
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      mushroom.position.set(x, heightAt(x, z), z);
      scene.add(mushroom);
    }

    // ===== ОБЛАКА =====
    const clouds = [];
    for (let c = 0; c < 15; c++) {
      const cloud = new THREE.Group();
      for (let p = 0; p < 8; p++) {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(1.5 + Math.random() * 2, 8, 8),
          new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true })
        );
        puff.position.set(p * 1.8 - 4, Math.random() * 0.8, Math.random() * 0.8);
        cloud.add(puff);
      }
      cloud.position.set(-70 + Math.random() * 140, 15 + Math.random() * 10, -50 - Math.random() * 30);
      scene.add(cloud);
      clouds.push(cloud);
    }

    // ===== БАБОЧКИ: тело, усики, 4 крыла с узором, машут =====
    const butterflies = [];
    for (let i = 0; i < 22; i++) {
      const b = new THREE.Group();
      const hue = Math.random();
      const wingCol = new THREE.Color().setHSL(hue, 0.9, 0.65);
      const spotCol = new THREE.Color().setHSL((hue + 0.5) % 1, 0.9, 0.45);
      const wingMat = new THREE.MeshStandardMaterial({ color: wingCol, side: THREE.DoubleSide, flatShading: true });
      const spotMat = new THREE.MeshStandardMaterial({ color: spotCol, side: THREE.DoubleSide });

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.025, 0.35, 6),
        new THREE.MeshStandardMaterial({ color: 0x212121 })
      );
      body.rotation.x = Math.PI / 2;
      b.add(body);
      // усики
      for (const s of [-1, 1]) {
        const ant = new THREE.Mesh(
          new THREE.CylinderGeometry(0.006, 0.006, 0.18, 3),
          new THREE.MeshStandardMaterial({ color: 0x212121 })
        );
        ant.position.set(s * 0.04, 0.05, 0.22);
        ant.rotation.x = -0.7;
        ant.rotation.z = s * 0.4;
        b.add(ant);
      }
      function makeWing(side) {
        const w = new THREE.Group();
        const upper = new THREE.Mesh(new THREE.CircleGeometry(0.24, 8), wingMat);
        upper.rotation.x = -Math.PI / 2;
        upper.scale.set(1, 0.75, 1);
        upper.position.set(side * 0.15, 0, 0.07);
        const lower = new THREE.Mesh(new THREE.CircleGeometry(0.16, 8), wingMat);
        lower.rotation.x = -Math.PI / 2;
        lower.scale.set(0.9, 0.8, 1);
        lower.position.set(side * 0.11, 0, -0.12);
        const spot = new THREE.Mesh(new THREE.CircleGeometry(0.06, 8), spotMat);
        spot.rotation.x = -Math.PI / 2;
        spot.position.set(side * 0.17, 0.002, 0.07);
        w.add(upper, lower, spot);
        return w;
      }
      const wl = makeWing(-1), wr = makeWing(1);
      b.add(wl, wr);

      b.userData = {
        wl, wr,
        phase: Math.random() * Math.PI * 2,
        angle: Math.random() * Math.PI * 2,
        radius: 4 + Math.random() * 16,
        speed: 0.4 + Math.random() * 0.6,
        height: 1.5 + Math.random() * 3
      };
      scene.add(b);
      butterflies.push(b);
    }

    // ===== ПТИЦЫ =====
    const birds = [];
    for (let i = 0; i < 12; i++) {
      const bird = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.ConeGeometry(0.25, 1, 4),
        new THREE.MeshStandardMaterial({ color: 0x424242, flatShading: true })
      );
      body.rotation.z = Math.PI / 2;
      bird.add(body);
      const wing1 = new THREE.Mesh(
        new THREE.ConeGeometry(0.15, 0.6, 3),
        new THREE.MeshStandardMaterial({ color: 0x616161, flatShading: true })
      );
      wing1.position.y = 0.1; wing1.rotation.z = Math.PI / 4;
      bird.add(wing1);
      const wing2 = wing1.clone();
      wing2.rotation.z = -Math.PI / 4;
      bird.add(wing2);
      bird.userData = {
        angle: Math.random() * Math.PI * 2,
        radius: 60 + Math.random() * 30,
        speed: 0.2 + Math.random() * 0.3,
        height: 20 + Math.random() * 10
      };
      scene.add(bird);
      birds.push(bird);
    }

    // ===== ЗАЙЦЫ: глаза, нос, анимированные лапы =====
    const rabbits = [];
    for (let i = 0; i < 8; i++) {
      const rabbit = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xD7CCC8, flatShading: true });
      const earMat = new THREE.MeshStandardMaterial({ color: 0xBCAAA4, flatShading: true });

      const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), bodyMat);
      body.scale.set(1, 0.9, 1.4); body.position.y = 0.4;
      rabbit.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), bodyMat);
      head.position.set(0, 0.62, 0.48);
      rabbit.add(head);
      // глаза + нос
      for (const s of [-1, 1]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 5, 5),
          new THREE.MeshStandardMaterial({ color: 0x212121 }));
        eye.position.set(s * 0.13, 0.7, 0.7);
        rabbit.add(eye);
      }
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045, 5, 5),
        new THREE.MeshStandardMaterial({ color: 0xEF9A9A }));
      nose.position.set(0, 0.6, 0.75);
      rabbit.add(nose);
      const ear1 = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.4, 4), earMat);
      ear1.position.set(-0.1, 0.9, 0.45); ear1.rotation.x = -0.2;
      rabbit.add(ear1);
      const ear2 = ear1.clone(); ear2.position.x = 0.1;
      rabbit.add(ear2);
      // лапы (анимируются)
      const legs = [];
      const legPositions = [[-0.2, 0.15, 0.3], [0.2, 0.15, 0.3], [-0.2, 0.15, -0.3], [0.2, 0.15, -0.3]];
      legPositions.forEach(pos => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.3, 4), earMat);
        leg.position.set(...pos);
        rabbit.add(leg);
        legs.push(leg);
      });
      const tail = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6),
        new THREE.MeshStandardMaterial({ color: 0xFFFFFF, flatShading: true }));
      tail.position.set(0, 0.35, -0.52);
      rabbit.add(tail);

      const a = Math.random() * Math.PI * 2;
      const d = 8 + Math.random() * 20;
      rabbit.position.set(Math.cos(a) * d, heightAt(Math.cos(a) * d, Math.sin(a) * d), Math.sin(a) * d);
      rabbit.userData = { speed: 0.8 + Math.random() * 0.7, legs, phase: Math.random() * 6,
        tx: rabbit.position.x, tz: rabbit.position.z, rest: Math.random() * 3, minD: 5, maxD: 28 };
      scene.add(rabbit);
      rabbits.push(rabbit);
    }

    // ===== СОБАКИ: глаза, виляющий хвост, лапы =====
    const dogs = [];
    for (let i = 0; i < 5; i++) {
      const dog = new THREE.Group();
      const bodyColor = new THREE.Color().setHSL(0.08 + Math.random() * 0.1, 0.7, 0.5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, flatShading: true });

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 1.3), bodyMat);
      body.position.y = 0.55;
      dog.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.6), bodyMat);
      head.position.set(0, 0.75, 0.7);
      dog.add(head);
      const snout = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.25, 0.3),
        new THREE.MeshStandardMaterial({ color: 0x8D6E63, flatShading: true })
      );
      snout.position.set(0, 0.65, 1.0);
      dog.add(snout);
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 4, 4),
        new THREE.MeshStandardMaterial({ color: 0x212121 }));
      nose.position.set(0, 0.7, 1.15);
      dog.add(nose);
      for (const s of [-1, 1]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 5, 5),
          new THREE.MeshStandardMaterial({ color: 0x212121 }));
        eye.position.set(s * 0.15, 0.85, 0.98);
        dog.add(eye);
      }
      const earMat = new THREE.MeshStandardMaterial({ color: bodyColor.clone().multiplyScalar(0.8), flatShading: true });
      const ear1 = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.25, 4), earMat);
      ear1.position.set(-0.2, 1.0, 0.7); ear1.rotation.z = 0.3;
      dog.add(ear1);
      const ear2 = ear1.clone(); ear2.position.x = 0.2; ear2.rotation.z = -0.3;
      dog.add(ear2);
      const legs = [];
      [[-0.25, 0.28, 0.4], [0.25, 0.28, 0.4], [-0.25, 0.28, -0.4], [0.25, 0.28, -0.4]].forEach(pos => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.55, 4),
          new THREE.MeshStandardMaterial({ color: bodyColor.clone().multiplyScalar(0.9), flatShading: true }));
        leg.position.set(...pos);
        dog.add(leg);
        legs.push(leg);
      });
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.5, 4), bodyMat);
      tail.position.set(0, 0.75, -0.7);
      tail.rotation.x = -Math.PI / 3;
      dog.add(tail);

      const a = Math.random() * Math.PI * 2;
      const d = 12 + Math.random() * 15;
      dog.position.set(Math.cos(a) * d, heightAt(Math.cos(a) * d, Math.sin(a) * d), Math.sin(a) * d);
      dog.userData = { speed: 1.3 + Math.random() * 0.8, legs, tail, phase: Math.random() * 6,
        tx: dog.position.x, tz: dog.position.z, rest: Math.random() * 3, minD: 8, maxD: 26 };
      scene.add(dog);
      dogs.push(dog);
    }

    // ===== ГЛАВНЫЙ КАМЕНЬ =====
    const rockGroup = new THREE.Group();
    const geo = new THREE.SphereGeometry(0.8, 24, 16);
    {
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const n = Math.sin(v.x * 3.1 + v.y * 2.7) * Math.sin(v.y * 3.7 + v.z * 4.1) * Math.sin(v.z * 2.9 + v.x * 3.3);
        v.multiplyScalar(1 + n * 0.15);
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geo.computeVertexNormals();
    }
    const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: 0x9E9E9E, roughness: 0.8, flatShading: true
    }));
    rock.scale.set(1.0, 0.8, 0.9);
    rock.castShadow = true;
    rockGroup.add(rock);
    rockGroup.position.y = 0.35;
    scene.add(rockGroup);

    // Маленькие камни вокруг
    for (let i = 0; i < 25; i++) {
      const s = 0.2 + Math.random() * 0.35;
      const pebble = new THREE.Mesh(
        new THREE.IcosahedronGeometry(s, 0),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0, 0, 0.35 + Math.random() * 0.2),
          flatShading: true
        })
      );
      const a = Math.random() * Math.PI * 2, d = 3 + Math.random() * 20;
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      pebble.position.set(x, heightAt(x, z) + s / 2, z);
      pebble.rotation.set(Math.random(), Math.random(), Math.random());
      pebble.castShadow = true;
      scene.add(pebble);
    }

    // ===== КАМЕРА: ограниченный обзор + автоповорот в простое =====
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.3, 0);
    controls.minDistance = 3;              // не подлетать вплотную
    controls.maxDistance = 22;             // не отлетать за поляну
    controls.maxPolarAngle = Math.PI / 2.15; // не заглядывать под землю
    controls.enablePan = false;            // камень всегда в центре
    controls.autoRotateSpeed = 1.2;

    let lastInteract = performance.now();
    function markActive() { lastInteract = performance.now(); }
    ['pointerdown', 'wheel', 'touchstart', 'keydown'].forEach(ev =>
      window.addEventListener(ev, markActive));

      // Блуждание: идёт к точке, дошёл — выбирает новую, иногда отдыхает
function wander(obj, u, dt) {
  if (u.rest > 0) { u.rest -= dt; return false; }
  const dx = u.tx - obj.position.x, dz = u.tz - obj.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.5) {
    const a = Math.random() * Math.PI * 2;
    const d = u.minD + Math.random() * (u.maxD - u.minD);
    u.tx = Math.cos(a) * d; u.tz = Math.sin(a) * d;
    if (Math.random() < 0.4) u.rest = 1 + Math.random() * 3;
    return false;
  }
  const vx = dx / dist * u.speed * dt, vz = dz / dist * u.speed * dt;
  obj.position.x += vx; obj.position.z += vz;
  obj.rotation.y = Math.atan2(vx, vz);   // смотрит КУДА идёт
  return true;
}
    // ===== АНИМАЦИЯ =====
    let t = 0;
    (function animate() {
      requestAnimationFrame(animate);
      t += 0.016;

      const idle = performance.now() - lastInteract > 3000;
      controls.autoRotate = idle;
      idleHint.style.display = (idle && loginForm.style.display === 'none') ? 'block' : 'none';

      // Облака плывут
      clouds.forEach(c => {
        c.position.x += 0.015;
        if (c.position.x > 80) c.position.x = -80;
      });

      // Деревья покачиваются
      trees.forEach(tr => {
        tr.rotation.z = Math.sin(t * 1.2 + tr.userData.phase) * 0.015;
      });

            // ===== Бабочки =====
        butterflies.forEach(b => {
        const u = b.userData;
        u.angle += 0.02 * u.speed;
        b.position.x = Math.cos(u.angle) * u.radius;
        b.position.z = Math.sin(u.angle) * u.radius;
        b.position.y = u.height + Math.sin(t * 3 + u.phase) * 0.5;
        b.rotation.y = Math.atan2(-Math.sin(u.angle), Math.cos(u.angle));   // ← только эта строка
        const flap = 0.5 + Math.abs(Math.sin(t * 10 + u.phase)) * 0.9;
        u.wl.rotation.z = -flap;
        u.wr.rotation.z = flap;
        });

      // Птицы
      birds.forEach(b => {
        b.userData.angle += 0.01 * b.userData.speed;
        b.position.x = Math.cos(b.userData.angle) * b.userData.radius;
        b.position.z = Math.sin(b.userData.angle) * b.userData.radius;
        b.position.y = b.userData.height;
        b.rotation.y = b.userData.angle + Math.PI / 2;
      });

      // Зайцы: скачут к случайным точкам
            rabbits.forEach(r => {
            const u = r.userData;
            const moving = wander(r, u, 0.016);
            r.position.y = heightAt(r.position.x, r.position.z)
                + (moving ? Math.abs(Math.sin(t * 6 + u.phase)) * 0.25 : 0);
            const hop = moving ? Math.sin(t * 8 + u.phase) : 0;
            u.legs[0].rotation.x = hop * 0.4;
            u.legs[1].rotation.x = -hop * 0.4;
            u.legs[2].rotation.x = -hop * 0.4;
            u.legs[3].rotation.x = hop * 0.4;
            });;

            // Собаки: бегают и виляют хвостом
        dogs.forEach(d => {
        const u = d.userData;
        const moving = wander(d, u, 0.016);
        d.position.y = heightAt(d.position.x, d.position.z);
        const run = moving ? Math.sin(t * 10 + u.phase) : 0;
        u.legs[0].rotation.x = run * 0.5;
        u.legs[1].rotation.x = -run * 0.5;
        u.legs[2].rotation.x = -run * 0.5;
        u.legs[3].rotation.x = run * 0.5;
        u.tail.rotation.y = Math.sin(t * 8 + u.phase) * (moving ? 0.6 : 0.2);
        });

      controls.update();
      renderer.render(scene, camera);
    })();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
